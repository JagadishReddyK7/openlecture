# Scrapes every replica of both services. Docker's DNS returns one A record
# per container of a scaled service, so `--scale core-api=N` is picked up on
# the next refresh with no config change (unlike nginx, which resolves once).
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: core-api
    dns_sd_configs:
      - names: [core-api]
        type: A
        port: 4000
        refresh_interval: 10s

  - job_name: streaming-engine
    dns_sd_configs:
      - names: [streaming-engine]
        type: A
        port: 4001
        refresh_interval: 10s
