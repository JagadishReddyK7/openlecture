# GlobalClass API Gateway — Nginx
# Routes traffic between the two microservices and load-balances across scaled instances:
#   core-api         (port 4000) — Auth, Catalog, Scheduling, Q&A
#   streaming-engine (port 4001) — Stream session management + LiveKit tokens
#
# LOAD BALANCING:
#   Nginx uses `least_conn` load balancing for HTTP — new requests go to whichever
#   upstream instance has the fewest active connections.
#
#   The Docker service name (core-api, streaming-engine) resolves to ALL container IPs
#   when scaled with --scale, so adding more upstream entries is not needed.
#   Nginx only resolves at startup — restart api-gateway after scaling.
#
#   To scale: docker compose up -d --scale core-api=3
#   All 3 instances share the same Redis for Q&A state and Pub/Sub broadcast.
#
# WEBSOCKET STICKINESS:
#   WebSocket connections (Q&A) are long-lived. Once a client opens a WS connection
#   to an instance, it stays there for the session — no mid-session re-routing.
#   New connections are distributed via least_conn; existing connections are stable.
#   Redis Pub/Sub ensures all instances broadcast Q&A updates to their local clients,
#   so users on different instances all see the same real-time question feed.

upstream core_api {
    least_conn;
    server core-api:4000;
    # NOTE on Docker DNS and scaling:
    # Nginx resolves `core-api` once, at startup, and adds every container IP
    # it gets back as a server. Containers added later are NOT picked up, so
    # after `docker compose up --scale ...` run:
    #   docker compose restart api-gateway
}

upstream streaming {
    least_conn;
    server streaming-engine:4001;
}

# MinIO S3 API — serves HLS segments to bulk-tier viewers.
# In production this upstream would be replaced by a real CDN (CloudFront, Cloudflare).
upstream minio_s3 {
    server minio:9000;
}

server {
    listen 80;

    # ── Streaming Engine routes ──────────────────────────────────
    location /api/stream {
        proxy_pass         http://streaming;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # ── Q&A WebSocket (load-balanced, Redis Pub/Sub keeps all instances in sync) ──
    location /qaws {
        proxy_pass         http://core_api;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── HLS (bulk-tier viewers via MinIO) ─────────────────────────────────────
    # Two different caching rules:
    #   *.m3u8 playlists change every segment  → must not be cached
    #   *.ts / *.m4s segments never change once written → cache for a year
    # Marking segments no-cache (as before) would make every viewer hit the
    # origin for every segment and defeat a CDN placed in front of this.
    # In production: this upstream would be CloudFront/Cloudflare CDN.
    location ~ ^/hls/.+\.m3u8$ {
        proxy_pass         http://minio_s3;
        proxy_set_header   Host               minio;
        proxy_hide_header  x-amz-id-2;
        proxy_hide_header  x-amz-request-id;
        add_header         Access-Control-Allow-Origin  *  always;
        add_header         Cache-Control                "no-cache" always;
        types { application/vnd.apple.mpegurl m3u8; }
    }

    location /hls/ {
        proxy_pass         http://minio_s3;
        proxy_set_header   Host               minio;
        proxy_hide_header  x-amz-id-2;
        proxy_hide_header  x-amz-request-id;
        add_header         Access-Control-Allow-Origin  *  always;
        add_header         Access-Control-Allow-Headers "Range" always;
        add_header         Cache-Control                "public, max-age=31536000, immutable" always;
        types {
            video/mp2t  ts;
            video/iso.segment m4s;
            video/mp4   mp4;
        }
    }

    # ── Core API — all other REST routes ──────────────────────────────
    location /api {
        proxy_pass         http://core_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # Health checks for each service
    location /health/core {
        proxy_pass http://core_api/health;
    }

    location /health/streaming {
        proxy_pass http://streaming/health;
    }
}
